name: Fetch Chess.com Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch club info
        run: |
          curl -s "https://api.chess.com/pub/club/the-elegant" \
            -H "User-Agent: Mozilla/5.0" \
            -o data/club.json

      - name: Fetch members
        run: |
          curl -s "https://api.chess.com/pub/club/the-elegant/members" \
            -H "User-Agent: Mozilla/5.0" \
            -o data/members_raw.json

      - name: Fetch matches
        run: |
          curl -s "https://api.chess.com/pub/club/the-elegant/matches" \
            -H "User-Agent: Mozilla/5.0" \
            -o data/matches.json

      - name: Process data
        run: python3 fetch_data.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update chess data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
