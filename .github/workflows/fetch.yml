name: Fetch Chess.com Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Chess.com data
        run: |
          CLUB="the-elegant"

          curl -s "https://api.chess.com/pub/club/$CLUB" \
            -H "User-Agent: Mozilla/5.0" \
            -o data/club.json

          curl -s "https://api.chess.com/pub/club/$CLUB/members" \
            -H "User-Agent: Mozilla/5.0" \
            -o data/members_raw.json

          curl -s "https://api.chess.com/pub/club/$CLUB/matches" \
            -H "User-Agent: Mozilla/5.0" \
            -o data/matches.json

          python3 << 'PYEOF'
import json, urllib.request, time

def fetch(url):
    req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
    return json.loads(urllib.request.urlopen(req, timeout=10).read())

def country_flag(code):
    if not code: return ''
    code = code.strip('/').split('/')[-1].upper()
    if len(code) != 2: return ''
    return chr(ord(code[0]) + 127397) + chr(ord(code[1]) + 127397)

def league_icon(league):
    icons = {
        'Legend': '👑', 'Champion': '💎', 'Elite': '🔥',
        'Diamond': '💠', 'Platinum': '🪙', 'Gold': '🥇',
        'Silver': '🥈', 'Bronze': '🥉', 'Stone': '🪨', 'Wood': '🪵'
    }
    return icons.get(league, '')

def time_ago(ts):
    if not ts: return ''
    diff = int(time.time()) - ts
    if diff < 3600:   return f"{diff//60}m ago"
    if diff < 86400:  return f"{diff//3600}h ago"
    if diff < 604800: return f"{diff//86400}d ago"
    return f"{diff//604800}w ago"

# ── Raw data ──
with open('data/members_raw.json') as f:
    members = json.load(f)

weekly  = members.get('weekly',  [])
monthly = members.get('monthly', [])

# ── Top active members ──
seen = set(m['username'] for m in weekly)
pool = (
    [dict(m, tier='weekly')  for m in weekly[:6]] +
    [dict(m, tier='monthly') for m in monthly if m['username'] not in seen][:4]
)[:6]

enriched = []
for m in pool:
    u = m['username']
    try:
        prof  = fetch(f"https://api.chess.com/pub/player/{u}")
        stats = fetch(f"https://api.chess.com/pub/player/{u}/stats")

        # Best rating across formats (peak ever)
        peak = max(filter(None, [
            (stats.get('chess_rapid',  {}).get('best', {}) or {}).get('rating'),
            (stats.get('chess_blitz',  {}).get('best', {}) or {}).get('rating'),
            (stats.get('chess_bullet', {}).get('best', {}) or {}).get('rating'),
        ]), default=None)

        # Current rating (fallback)
        current = (
            (stats.get('chess_rapid',  {}).get('last', {}) or {}).get('rating') or
            (stats.get('chess_blitz',  {}).get('last', {}) or {}).get('rating') or
            (stats.get('chess_bullet', {}).get('last', {}) or {}).get('rating')
        )

        # W/D/L totals across all formats
        wins = draws = losses = 0
        for fmt in ['chess_rapid','chess_blitz','chess_bullet','chess_daily']:
            rec = stats.get(fmt, {}).get('record', {}) or {}
            wins   += rec.get('win',  0)
            draws  += rec.get('draw', 0)
            losses += rec.get('loss', 0)

        enriched.append({
            'username':    u,
            'tier':        m['tier'],
            'avatar':      prof.get('avatar'),
            'title':       prof.get('title'),
            'rating':      current,
            'peak':        peak,
            'name':        prof.get('name'),
            'country':     country_flag(prof.get('country','')),
            'league':      prof.get('league',''),
            'league_icon': league_icon(prof.get('league','')),
            'last_online': time_ago(prof.get('last_online')),
            'followers':   prof.get('followers', 0),
            'wins':        wins,
            'draws':       draws,
            'losses':      losses,
        })
        time.sleep(0.35)
    except Exception as e:
        print(f"  failed {u}: {e}")
        enriched.append({'username':u,'tier':m['tier'],'avatar':None,'title':None,'rating':None,'peak':None,'name':None,'country':'','league':'','league_icon':'','last_online':'','followers':0,'wins':0,'draws':0,'losses':0})

enriched.sort(key=lambda x: x['peak'] or x['rating'] or 0, reverse=True)

# ── Newest members ──
newest_pool = monthly[:8]
newest = []
for m in newest_pool:
    u = m['username'] if isinstance(m, dict) else m
    try:
        prof = fetch(f"https://api.chess.com/pub/player/{u}")
        newest.append({
            'username':    u,
            'avatar':      prof.get('avatar'),
            'title':       prof.get('title'),
            'joined':      prof.get('joined', 0),
            'country':     country_flag(prof.get('country','')),
            'league':      prof.get('league',''),
            'league_icon': league_icon(prof.get('league','')),
        })
        time.sleep(0.3)
    except:
        newest.append({'username':u,'avatar':None,'title':None,'joined':0,'country':'','league':'','league_icon':''})

newest.sort(key=lambda x: x['joined'], reverse=True)
newest = newest[:6]

# ── Club-level stats from matches ──
with open('data/matches.json') as f:
    matches = json.load(f)

total_matches = (
    len(matches.get('in_progress', [])) +
    len(matches.get('registered',  [])) +
    len(matches.get('finished',    []))
)
wins_m   = sum(1 for m in matches.get('finished',[]) if m.get('result')=='win')
losses_m = sum(1 for m in matches.get('finished',[]) if m.get('result')=='lose')
draws_m  = sum(1 for m in matches.get('finished',[]) if m.get('result')=='draw')

output = {
    'weekly_count':   len(weekly),
    'total_matches':  total_matches,
    'match_wins':     wins_m,
    'match_losses':   losses_m,
    'match_draws':    draws_m,
    'members':        enriched,
    'newest':         newest,
}
with open('data/members.json', 'w') as f:
    json.dump(output, f)

print(f"Done: {len(enriched)} active, {len(newest)} newest, {total_matches} matches")
PYEOF

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update chess data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
