name: Fetch Chess.com Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Chess.com data
        run: |
          CLUB="the-elegant"

          curl -s "https://api.chess.com/pub/club/$CLUB" \
            -H "User-Agent: Mozilla/5.0" \
            -o data/club.json

          curl -s "https://api.chess.com/pub/club/$CLUB/members" \
            -H "User-Agent: Mozilla/5.0" \
            -o data/members_raw.json

          curl -s "https://api.chess.com/pub/club/$CLUB/matches" \
            -H "User-Agent: Mozilla/5.0" \
            -o data/matches.json

          python3 << 'PYEOF'
          import json, urllib.request, time

          with open('data/members_raw.json') as f:
              members = json.load(f)

          weekly  = members.get('weekly',  [])
          monthly = members.get('monthly', [])
          recent  = members.get('all_members', members.get('all', []))

          # ── Top active members (sorted by rating) ──
          seen = set(m['username'] for m in weekly)
          pool = (
              [dict(m, tier='weekly')  for m in weekly[:6]] +
              [dict(m, tier='monthly') for m in monthly if m['username'] not in seen][:4]
          )[:6]

          enriched = []
          for m in pool:
              u = m['username']
              try:
                  req  = urllib.request.Request(f"https://api.chess.com/pub/player/{u}", headers={"User-Agent":"Mozilla/5.0"})
                  prof = json.loads(urllib.request.urlopen(req, timeout=8).read())
                  req2 = urllib.request.Request(f"https://api.chess.com/pub/player/{u}/stats", headers={"User-Agent":"Mozilla/5.0"})
                  stats = json.loads(urllib.request.urlopen(req2, timeout=8).read())
                  rating = (
                      (stats.get('chess_rapid',  {}).get('last', {}) or {}).get('rating') or
                      (stats.get('chess_blitz',  {}).get('last', {}) or {}).get('rating') or
                      (stats.get('chess_bullet', {}).get('last', {}) or {}).get('rating')
                  )
                  enriched.append({'username':u,'tier':m['tier'],'avatar':prof.get('avatar'),'title':prof.get('title'),'rating':rating,'name':prof.get('name')})
                  time.sleep(0.3)
              except:
                  enriched.append({'username':u,'tier':m['tier'],'avatar':None,'title':None,'rating':None,'name':None})

          enriched.sort(key=lambda x: x['rating'] or 0, reverse=True)

          # ── Newest members (last 6 to join) ──
          # The API returns members in the 'all_members' list sorted newest first
          # Fall back to monthly list tail if all_members not available
          newest_pool = []
          if recent:
              newest_pool = recent[:8]
          else:
              # monthly is sorted newest-first in Chess.com API
              newest_pool = monthly[:8]

          newest = []
          for m in newest_pool:
              u = m['username'] if isinstance(m, dict) else m
              try:
                  req  = urllib.request.Request(f"https://api.chess.com/pub/player/{u}", headers={"User-Agent":"Mozilla/5.0"})
                  prof = json.loads(urllib.request.urlopen(req, timeout=8).read())
                  joined = prof.get('joined', 0)
                  newest.append({'username':u,'avatar':prof.get('avatar'),'title':prof.get('title'),'joined':joined})
                  time.sleep(0.3)
              except:
                  newest.append({'username':u,'avatar':None,'title':None,'joined':0})

          # Sort by join date descending (most recent first)
          newest.sort(key=lambda x: x['joined'], reverse=True)
          newest = newest[:6]

          output = {
              'weekly_count': len(weekly),
              'members': enriched,
              'newest': newest
          }
          with open('data/members.json', 'w') as f:
              json.dump(output, f)

          print(f"Saved {len(enriched)} active, {len(newest)} newest")
          PYEOF

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update chess data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
